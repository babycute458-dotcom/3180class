name: Build duilian iOS IPA (Sideloadly)

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout app source branch
        uses: actions/checkout@v4
        with:
          ref: cursor/duilian-speech-practice-d923

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install & build web
        run: |
          npm install
          npm run build

      - name: Install Capacitor iOS
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Add iOS platform & sync
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          cd ios/App
          pod install --repo-update

      - name: Patch Info.plist privacy strings
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 對練需要使用麥克風，才能練習說英文。" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 對練需要使用麥克風，才能練習說英文。" "$PLIST"
          echo "---- Info.plist privacy keys ----"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$PLIST"

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find ios/App/DerivedData/Build/Products -name 'App.app' -print -quit)
          echo "Using $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload duilian.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r duilian.ipa Payload
          ls -lh duilian.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: duilian-ios-ipa
          path: duilian.ipa
          if-no-files-found: error
